# Reproducible integration environment for the lab monitoring system.
#
# It provides the two external dependencies the backend needs: an MQTT broker and
# a PostgreSQL database. The example credentials here are for a local, disposable
# environment only; a deployment takes its own from the environment, and none of
# them are referenced by any checked-in configuration or test.
#
# Usage:
#   docker compose -f deploy/compose.yaml up -d
#   DATABASE_URL='postgres://lab:lab@localhost:5432/lab?sslmode=disable' \
#   MQTT_BROKER_URL='localhost:1883' MQTT_USERNAME=backend MQTT_PASSWORD=backend-secret \
#     go run ./backend
#
# See docs/integration-testing.md for the full acceptance run.

name: lab-monitoring

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      # A non-default host port so the environment cannot collide with another
      # PostgreSQL a developer already has running.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:5.8
    environment:
      # Phase 1 runs without TLS because the deployment target is a lab network.
      # The plan records TLS as a deployment condition, not a phase-1 one.
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin-secret
      # File-based authorization, so the ACL is reviewable in the repository
      # rather than only in a dashboard. Devices and the backend get separate
      # accounts with the access the frozen contract requires.
      EMQX_AUTHORIZATION__SOURCES: '[{"type":"file","enable":true,"path":"/opt/emqx/etc/acl.conf"}]'
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
