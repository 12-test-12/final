%% MQTT authorization rules for the lab monitoring system.
%%
%% The frozen contract at docs/device-protocol.md requires the broker to limit
%% each side to its own direction: a device publishes telemetry and
%% acknowledgements and subscribes only to control, while the backend does the
%% reverse. Without that split, a device could publish on the control topic and
%% command itself or its neighbours.
%%
%% The rules below use EMQX's file-based authorization syntax. They have NOT been
%% executed against a running EMQX in this repository: the image is not available
%% in the environment where this file was written, so the syntax must be checked
%% against the deployed EMQX version before the acceptance run. The *intent* of
%% each rule is what matters and is stated in the comment beside it.

%% The backend subscribes to everything a device publishes.
{allow, {user, "backend"}, subscribe, ["device/telemetry", "device/command-ack"]}.
%% The backend publishes only control commands.
{allow, {user, "backend"}, publish, ["device/control"]}.

%% A device publishes telemetry and its own acknowledgements.
{allow, {user, "device"}, publish, ["device/telemetry", "device/command-ack"]}.
%% A device subscribes only to control. It cannot read other devices' telemetry,
%% which is what stops one compromised node from learning the whole deployment.
{allow, {user, "device"}, subscribe, ["device/control"]}.

%% Everything else is refused, so a new topic has to be added here deliberately
%% rather than becoming reachable by default.
{deny, all}.
